  <style>
    *, *::before, *::after {

      position: fixed;
      inset: 0;
      display: block;
      z-index: 0;
    }

    .name {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 7vw;
      font-weight: 600;
      color: #fff;
      z-index: 3;
      text-shadow: 0 0 1px rgba(255,255,255,.2), 0 1px 2px rgba(0,0,0,.25);
      pointer-events: none;
    }

    .nav {
      position: fixed;
      top: 20px;
      right: 30px;
      z-index: 4;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #e8d6ff;
      text-decoration: none;
      padding: 6px 12px;
      background: rgba(0,0,0,.3);
      border-radius: 4px;
      transition: background .3s ease;
    }

    .nav a:hover {
      background: rgba(255,255,255,.1);
    }

    @media (max-width: 600px) {
      .nav {
        flex-direction: column;
        align-items: flex-end;
        right: 15px;
        top: 15px;
        gap: 4px;
      }

      .nav a {
        font-size: 0.9em;
        padding: 4px 8px;
      }
    }

    .portfolio {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,.9);
      overflow: auto;
      z-index: 20;
      padding: 60px 5vw 40px;
      box-sizing: border-box;
    }

    .portfolio .close {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 2em;
      color: #e8d6ff;
      cursor: pointer;
      z-index: 21;
    }

    .portfolio h3 {
      color: #e8d6ff;
      text-align: center;
      margin: 0;
    }

      display: flex;

  <div class="portfolio" id="portfolio">
    <div class="close" id="closePortfolio">&times;</div>
    <div class="portfolio-header">
      <h3>Portfolio</h3>
      <div class="portfolio-filters" id="portfolioFilters" aria-label="Portfolio filters"></div>
    </div>
    <div class="image-grid" id="imageGrid"></div>

  <script>
    const PORTFOLIO_PARAM = 'filter';

    function getFilterFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get(PORTFOLIO_PARAM);
    }

    function setFilterInURL(type) {
      const url = new URL(window.location.href);
      if (type === 'all') {
        url.searchParams.delete(PORTFOLIO_PARAM);
      } else {
        url.searchParams.set(PORTFOLIO_PARAM, type);
      }
      history.replaceState(null, '', url.toString());
    }

    document.getElementById('showPortfolio').onclick = e => {
      e.preventDefault();
      activeType = 'current';
      setFilterInURL(activeType);
      renderFilters();
      renderPortfolio();
      document.getElementById('portfolio').style.display = 'block';
    };
    document.getElementById('closePortfolio').onclick = () => {
      document.getElementById('portfolio').style.display = 'none';
      setFilterInURL('all');
    };
    document.getElementById('lightbox').onclick = () => {
      document.getElementById('lightbox').style.display = 'none';
    };
    document.getElementById('lightboxClose').onclick = () => {
      document.getElementById('lightbox').style.display = 'none';
    };

    const typeLabels = {
      all: 'All',
      current: 'Current',
      drawing: 'Drawing',
      digital: 'Digital'
    };

    let portfolioItems = [];
    let activeType = 'all';
    const urlFilter = getFilterFromURL();
    if (urlFilter && Object.prototype.hasOwnProperty.call(typeLabels, urlFilter)) {
      activeType = urlFilter;
    }


    function renderFilters() {
      const filters = document.getElementById('portfolioFilters');
      filters.innerHTML = '';
      Object.entries(typeLabels).forEach(([type, label]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'portfolio-filter';
        button.textContent = label;
        button.setAttribute('aria-pressed', type === activeType ? 'true' : 'false');
        button.onclick = () => {
          activeType = type;
          setFilterInURL(type);
          renderFilters();
          renderPortfolio();
        };
        filters.appendChild(button);
      });
    }

    function renderPortfolio() {
      const grid = document.getElementById('imageGrid');
      grid.innerHTML = '';
      const visibleItems = activeType === 'all'
        ? portfolioItems
        : portfolioItems.filter(item => item.type === activeType);

      visibleItems.forEach(item => {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = `${typeLabels[item.type] || 'Portfolio'} work by Roger Link`;
        img.loading = 'lazy';
        img.onclick = () => {
          document.querySelector('#lightbox img').src = item.src;
          document.getElementById('lightbox').style.display = 'flex';
        };
        document.getElementById('imageGrid').appendChild(img);
      });
    }

    fetch('data/portfolio.json?v=portfolio-types-1', { cache: 'no-store' })
      .then(response => response.json())
      .then(items => {
        portfolioItems = items;
        renderFilters();
        renderPortfolio();
        if (urlFilter && Object.prototype.hasOwnProperty.call(typeLabels, urlFilter)) {
          document.getElementById('portfolio').style.display = 'block';
        }
      })
      .catch(() => {
        document.getElementById('imageGrid').innerHTML = '<p style="color:#e8d6ff;text-align:center;grid-column:1/-1;">Portfolio images could not be loaded.</p>';
      });
  </script>

  <!-- ---------- background: generative wave sculpture (Three.js) ---------- -->
  <script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

// ---------- shared GLSL: classic simplex 3D noise (Ashima Arts, MIT) ----------
const NOISE_GLSL = `
vec3 mod289(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ *ns.x + ns.yyyy;
  vec4 y = y_ *ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy,h.x);
  vec3 p1 = vec3(a0.zw,h.y);
  vec3 p2 = vec3(a1.xy,h.z);
  vec3 p3 = vec3(a1.zw,h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

// ---------- shared GLSL: layered fbm-ish noise used by both mesh and particles ----------
const LOBES_GLSL = `
float lobes(vec3 p, float t, float uScale) {
  float n = snoise(p * uScale + t);
  n += 0.5 * snoise(p * uScale * 2.1 - t * 0.7 + 4.0);
  n += 0.25 * snoise(p * uScale * 4.3 + t * 1.3 + 9.0);
  return n / 1.75;
}
float surfaceDisp(vec3 p, float t, float uScale, float uAmp) {
  float n = lobes(p, t, uScale);
  float big = snoise(p * 0.8 + t * 0.15) * 0.5;
  return (n * 0.65 + big) * uAmp;
}
`;

// ---------- shared GLSL: RGB<->HSV for continuous hue drift (public-domain utility) ----------
const HSV_GLSL = `
vec3 rgb2hsv(vec3 c) {
  vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  float e = 1.0e-10;
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
}
vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}
`;

// ---------- shared GLSL: traveling waves — three crossed plane waves at different angles,
// speeds and frequencies, so the wall rolls and ripples rather than just bulging or tearing ----------
const WAVE_GLSL = `
// a real ocean swell isn't a symmetric sine — it has a peaked, steep crest and a broad, shallow
// trough (the classic Stokes-wave shape). Adding a second harmonic in phase with the
// fundamental produces exactly that asymmetry: crests get taller and sharper, troughs get
// flatter, which is what actually reads as "peaking" rather than just bobbing.
float stokes(float phase) {
  // subtler than the textbook Stokes coefficient — a fully flat trough acts like a small
  // mirror and reflects the light across its whole face at once (broad white patches) rather
  // than as a point glint; this keeps the peaked/flat asymmetry without that side effect
  return cos(phase) + 0.16 * cos(2.0 * phase);
}
float waveDisp(vec3 p, float t) {
  // symmetric across x and y (equal frequency/amplitude, just different phase and direction
  // of travel) plus both diagonals, so every edge — top, bottom, left, right — gets the same
  // chance to bulge past the frame, not just left/right
  float w1 = stokes(p.x * 4.2 - t * 0.85);
  float w2 = stokes(p.y * 4.2 - t * 0.75 + 1.3);
  float w3 = stokes((p.x + p.y) * 2.8 + t * 1.0 + 3.0);
  float w4 = stokes((p.x - p.y) * 2.6 - t * 0.9 + 5.0);
  return w1 * 0.32 + w2 * 0.32 + w3 * 0.21 + w4 * 0.19;
}
float totalDisp(vec3 p, float t, float uScale, float uAmp, float uWaveAmp) {
  float d = surfaceDisp(p, t, uScale, uAmp);
  d += waveDisp(p, t) * uWaveAmp;
  return d;
}
`;

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
// `false` = don't let three.js write inline width/height styles onto the canvas — those
// fought with the page's own CSS (position:fixed; inset:0) and left the canvas stuck at a
// stale pixel size after a resize. Let CSS alone control the on-screen size.
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030203);
scene.fog = new THREE.FogExp2(0x030203, 0.05);

// Fixed vertical FOV. The wall geometry itself is resized dynamically (see below) to fill
// whatever aspect ratio the viewport has — full-bleed, no vitrine, built for a website hero.
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.3, 6.5);

// ---------- scene root ----------
const boxGroup = new THREE.Group();
scene.add(boxGroup);

// key light (cool, gallery-neutral) + dim ambient
const key = new THREE.DirectionalLight(0xdcdce8, 1.6);
key.position.set(2.5, 4, 4);
scene.add(key);
scene.add(new THREE.AmbientLight(0x241f2c, 0.85));

// pulsing sick-colored point light staining the walls from within, sitting in front of the wall
const sickLight = new THREE.PointLight(0x8cff4a, 0.9, 9, 2);
sickLight.position.set(-0.6, 0.4, 0.3);
scene.add(sickLight);
const sickLight2 = new THREE.PointLight(0xff2d8f, 0.7, 9, 2);
sickLight2.position.set(0.7, -0.5, 0.4);
scene.add(sickLight2);

// ---------- shared time/displacement uniforms (mesh + particles stay in lockstep) ----------
const sharedUniforms = {
  uTime: { value: 0 },
  uPulseFreq: { value: 0.28 },
  uAmp: { value: 0.4 }, // fine organic surface texture — also breaks up the wave's flat troughs
  uScale: { value: 1.5 },
  uWaveAmp: { value: 0.72 }, // dominant large-scale rolling waves
  uHueShift: { value: 0 },
  uSatShift: { value: 0 },
  uValShift: { value: 0 },
  // half-height of the wall in world units — used to scale the noise/wave UV space. Kept as a
  // uniform (not baked into the shader) so the wall can be resized to fill any aspect ratio
  // without recompiling shaders.
  uWallHalf: { value: 2.15 },
};

// ---------- FORM: a wave-morphing WALL of matter, full-bleed to fill the frame ----------
const geo = new THREE.PlaneGeometry(1, 1, 2, 2); // placeholder — sized for real below by fitWallToView()
const mesh = new THREE.Mesh(
  geo,
  new THREE.ShaderMaterial({
    uniforms: {
      ...sharedUniforms,
      uColorA: { value: new THREE.Color(0x6d17a8) }, // bruise purple — brightened, more saturated
      uColorB: { value: new THREE.Color(0x9dff4f) }, // sick chartreuse
      uColorC: { value: new THREE.Color(0xff2d9e) }, // toxic magenta
      uColorD: { value: new THREE.Color(0x3d0a52) }, // deep wound — no longer near-black, still moody but colorful
      uFresnelColor: { value: new THREE.Color(0x8affe0) },
      // raking, near-grazing light so the wave slopes actually catch strong shading contrast
      // and specular glints — a light from head-on barely reveals a heightfield's undulation
      // pushed far away (not just off to the side) so its DIRECTION stays consistent across
      // the wall regardless of how wide the wall gets on different aspect ratios — a nearby
      // light position gave very uneven illumination once the wall started spanning several
      // times its old width
      uLightPos: { value: new THREE.Vector3(48, 5, 6) },
    },
    vertexShader: `
      ${NOISE_GLSL}
      ${LOBES_GLSL}
      ${WAVE_GLSL}
      uniform float uTime;
      uniform float uPulseFreq;
      uniform float uAmp;
      uniform float uScale;
      uniform float uWaveAmp;
      uniform float uWallHalf;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      varying float vNoise;
      varying float vNoise2;
      varying float vWave;
      varying float vFoam;

      void main() {
        vec2 uv = position.xy / uWallHalf;
        vec3 p = vec3(uv, 0.0);
        float t = uTime * uPulseFreq;
        float n = lobes(p, t, uScale);
        float disp = totalDisp(p, t, uScale, uAmp, uWaveAmp);
        vec3 displaced = vec3(position.xy, disp);

        // heightfield normal via finite differences
        float e = 0.01;
        float du = totalDisp(vec3(uv.x + e, uv.y, 0.0), t, uScale, uAmp, uWaveAmp);
        float dv = totalDisp(vec3(uv.x, uv.y + e, 0.0), t, uScale, uAmp, uWaveAmp);
        float eWorld = e * uWallHalf;
        vec3 bumpedNormal = normalize(vec3(-(du - disp) / eWorld, -(dv - disp) / eWorld, 1.0));

        vNoise = n;
        vNoise2 = snoise(p * uScale * 1.4 - t * 0.4 + 12.0);
        vWave = waveDisp(p, t);
        // fast churning turbulence, sampled only where crests will need it — the "whitewater"
        // texture that reads as a wave breaking rather than a static white cap
        vFoam = snoise(p * 9.0 + t * 2.6) * 0.5 + 0.5;
        vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
        vWorldPos = worldPos.xyz;
        vNormal = normalize(mat3(modelMatrix) * bumpedNormal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: `
      ${HSV_GLSL}
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform vec3 uColorC;
      uniform vec3 uColorD;
      uniform vec3 uFresnelColor;
      uniform vec3 uLightPos;
      uniform float uHueShift;
      uniform float uSatShift;
      uniform float uValShift;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      varying float vNoise;
      varying float vNoise2;
      varying float vWave;
      varying float vFoam;
      void main() {
        // sparser, streakier blotches (avoid an even polka-dot / histology-slide read)
        float t1 = smoothstep(-0.3, 0.75, vNoise);
        float t2 = smoothstep(0.15, 0.85, vNoise2);
        vec3 base = mix(uColorD, uColorA, t1 * 0.85 + 0.15);
        base = mix(base, uColorC, pow(t2, 2.5) * 0.55);
        base = mix(base, uColorB, pow(max(vNoise2 - 0.4, 0.0), 2.0) * 1.3);

        // wave crests catch a hot chemical highlight — ties color directly to the traveling
        // wave motion so the piece morphs as one wavelike system, not disjoint layers
        float crest = smoothstep(0.1, 1.0, vWave);
        vec3 waveColor = mix(uColorC, uFresnelColor, 0.4);
        base = mix(base, waveColor, crest * 0.7);
        // troughs pushed darker and wider — real depth between swells, not just a tint
        float trough = smoothstep(-0.85, -0.15, -vWave);
        base = mix(base, uColorA * 0.35, trough * 0.6);

        // the crest "breaking": only right at the sharpest peak tips, a churning whitewater
        // mask — narrow on purpose, this should read as foam capping a crest, not a wash
        float foamMask = smoothstep(0.55, 0.95, vWave) * mix(0.55, 1.0, vFoam);
        vec3 foamColor = vec3(0.92, 0.97, 1.0);

        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        vec3 n = normalize(vNormal);
        float fresnel = pow(1.0 - max(dot(n, viewDir), 0.0), 2.2);

        // raking light: barely contributes overall brightness by design (that's what makes it
        // "raking") — used only to drive the sharp specular glint that reveals the wave slopes
        vec3 lightDir = normalize(uLightPos - vWorldPos);
        vec3 halfDir = normalize(lightDir + viewDir);
        float spec = pow(max(dot(n, halfDir), 0.0), 55.0);
        // a second, softer highlight underneath the tight glint — kept narrow (high power) so
        // it adds glossy roundness right around the sharp spark instead of washing broad areas
        float spec2 = pow(max(dot(n, halfDir), 0.0), 16.0) * 0.18;

        // front fill light: near the camera, so the surface actually reads bright and colorful
        // instead of the raking light's inherent near-darkness everywhere but the glints
        vec3 fillDir = normalize(vec3(0.0, 0.35, 1.0));
        float fillDiff = max(dot(n, fillDir), 0.0);
        float wrap = max(dot(n, fillDir) * 0.5 + 0.5, 0.0); // soft wrap-light, fleshy translucence feel

        base = mix(base, foamColor, foamMask);
        // the Stokes shaping creates broad, genuinely flat trough regions that face the fill
        // light almost head-on — kept the ceiling well under white so those big flat areas
        // read as richly lit, not blown out
        vec3 color = base * (0.6 + fillDiff * 0.52 + wrap * 0.28) + uFresnelColor * fresnel * 0.6;
        color += vec3(1.0, 0.98, 0.92) * (spec * 1.4 + spec2);

        // continuous hue + saturation drift — the palette itself morphs over time
        vec3 hsv = rgb2hsv(color);
        hsv.x = fract(hsv.x + uHueShift);
        // constant vibrancy boost on top of the drifting saturation, so the palette reads
        // richer overall, not just "sometimes more saturated"
        hsv.y = clamp(hsv.y * (1.6 + uSatShift), 0.0, 1.0);
        hsv.z = clamp(hsv.z * (1.0 + uValShift), 0.0, 1.4);
        color = hsv2rgb(hsv);

        gl_FragColor = vec4(color, 1.0);
      }
    `,
  })
);
mesh.position.z = -0.6;
boxGroup.add(mesh);


// ---------- full-bleed fit: size the wall to exactly cover the camera frustum at its depth,
// regardless of aspect ratio, with a small overscan margin so the camera's slight drift/shudder
// never reveals an edge. This resizes the CONTENT to match the view rather than distorting the
// camera to match fixed content (the earlier FOV-hack approach), so nothing gets cropped or
// stretched at any window shape.
// Generous margin — just fills the page edge to edge with no visible boundary, full-bleed.
const WALL_OVERSCAN = 1.3;
function fitWallToView() {
  const dist = camera.position.z - mesh.position.z;
  const vFovRad = THREE.MathUtils.degToRad(camera.fov);
  const halfH = Math.tan(vFovRad / 2) * dist * WALL_OVERSCAN;
  const halfW = halfH * camera.aspect;
  sharedUniforms.uWallHalf.value = halfH;

  // keep vertex density reasonable across aspect ratios (170 was the confirmed-safe ceiling
  // for this GPU before a high-subdivision rendering glitch appeared)
  const segY = 170;
  const segX = Math.min(260, Math.round(segY * Math.max(camera.aspect, 1)));
  mesh.geometry.dispose();
  mesh.geometry = new THREE.PlaneGeometry(halfW * 2, halfH * 2, segX, segY);
}
fitWallToView();

// ---------- POST-FX ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.45, // strength
  0.4,  // radius
  0.82  // threshold — raised since the brighter palette now crosses the old threshold too easily
);
composer.addPass(bloomPass);

const tripPass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uAberration: { value: 0.0028 },
    uGrain: { value: 0.06 },
    uVignette: { value: 0.12 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uAberration;
    uniform float uGrain;
    uniform float uVignette;
    varying vec2 vUv;
    void main() {
      vec2 dir = vUv - 0.5;
      float dist = length(dir);
      vec2 offset = dir * uAberration * (0.4 + dist);
      float r = texture2D(tDiffuse, vUv - offset).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv + offset).b;
      vec3 color = vec3(r, g, b);
      float grain = (fract(sin(dot(vUv * (uTime * 60.0 + 1.0), vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * uGrain;
      color += grain;
      float vig = 1.0 - smoothstep(0.15, 1.0, dist * (1.0 + uVignette));
      color *= mix(0.6, 1.0, vig);
      gl_FragColor = vec4(color, 1.0);
    }
  `,
});
tripPass.renderToScreen = true;
composer.addPass(tripPass);

// ---------- MOTION: pulse-quickening waves, throbbing light, slow camera drift ----------
const clock = new THREE.Clock();
const baseAmp = sharedUniforms.uAmp.value;
const basePulse = sharedUniforms.uPulseFreq.value;
const baseWaveAmp = sharedUniforms.uWaveAmp.value;
// a sharp, asymmetric pulse shape (not a clean sine) — a heartbeat has a spike, not a wave
function pulseShape(phase) {
  const s = Math.sin(phase * Math.PI * 2.0);
  return Math.sign(s) * Math.pow(Math.abs(s), 0.4);
}
// rare, violent flinches — a startle, not a metronome. Scheduled at irregular intervals with
// a fast-attack/slow-decay envelope so the piece occasionally seizes rather than just throbbing.
let lastFlinchStart = -Infinity;
let nextFlinch = 4 + Math.random() * 5;
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const escalation = Math.min(t / 45, 1); // ramps over ~45s, then holds — the trip deepening
  const heartbeatFreq = 0.55 + escalation * 1.5; // pulse quickening

  if (t >= nextFlinch) {
    lastFlinchStart = t;
    nextFlinch = t + 5 + Math.random() * 9;
  }
  const flinch = Math.exp(-Math.max(0, t - lastFlinchStart) * 7.0) * (t >= lastFlinchStart ? 1 : 0);

  sharedUniforms.uTime.value = t;
  sharedUniforms.uPulseFreq.value = basePulse + escalation * 0.35;
  const beat = pulseShape(t * heartbeatFreq);
  sharedUniforms.uAmp.value = baseAmp * (1.0 + 0.22 * beat + flinch * 0.5);
  sharedUniforms.uWaveAmp.value = baseWaveAmp * (1.0 + 0.3 * Math.max(beat, 0.0) + flinch * 0.5);

  const throb = 0.5 + 0.5 * beat;
  sickLight.intensity = 0.6 + throb * 0.7 + escalation * 0.3 + flinch * 1.2;
  sickLight2.intensity = 0.4 + (1 - throb) * 0.6 + escalation * 0.25 + flinch * 0.9;

  // irregular drift, not a clean turntable rotation — different periods per axis, plus a
  // small shudder synced to the pulse spike, and a much sharper jolt during a flinch
  const shudder = Math.max(beat - 0.7, 0.0) * 0.06 + flinch * 0.09;
  camera.position.x = Math.sin(t * 0.045) * 0.4 + Math.sin(t * 47.0) * shudder;
  camera.position.y = 0.3 + Math.cos(t * 0.037) * 0.22 + Math.cos(t * 53.0) * shudder;
  camera.position.z = 6.5 + Math.sin(t * 0.021) * 0.15;
  // look-at target's y matches the camera's own average drift height (0.3) — a fixed lower
  // target while the eye drifts up/down creates a constant downward tilt bias
  camera.lookAt(0, 0.3, 0.2);

  tripPass.uniforms.uTime.value = t;
  tripPass.uniforms.uAberration.value = 0.0022 + escalation * 0.0022 + throb * 0.0008 + flinch * 0.006;

  // bigger, faster, more layered color wander — three incommensurate frequencies instead of
  // two, wider range, so the palette swings through visibly distinct chemical moods rather
  // than a subtle drift, with a sharp jolt during a flinch
  sharedUniforms.uHueShift.value =
    0.26 * Math.sin(t * 0.09) +
    0.14 * Math.sin(t * 0.033 + 2.0) +
    0.08 * Math.sin(t * 0.21 + 5.0) +
    flinch * 0.4;
  sharedUniforms.uSatShift.value =
    0.28 * Math.sin(t * 0.05 + 1.0) + 0.15 * Math.sin(t * 0.13 + 4.0) + flinch * 0.3;
  sharedUniforms.uValShift.value = 0.12 * Math.sin(t * 0.037 + 2.5) + flinch * 0.2;

  composer.render();
});
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
  fitWallToView();
});
