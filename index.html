<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Variant pick happens as early as possible, before any heavy asset loads, so only the
       chosen variant's Three.js code gets fetched. Two variants, both the wave sculpture:
       "today" is the current warm/dimensional version, "yesterday" is the version committed
       to master before today's palette/depth work. -->
  <script>
    window.__variant = Math.random() < 0.5 ? "today" : "yesterday";
  </script>

  <!-- SEO Metadata -->
  <title>Roger Link - Maker and Software Engineer</title>
  <meta name="description" content="Roger Link - maker and software engineer creating immersive digital and physical experiences." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://rogerlink.com/" />

  <!-- Open Graph Metadata (for better sharing previews) -->
  <meta property="og:title" content="Roger Link - Maker and Software Engineer" />
  <meta property="og:description" content="Explore the portfolio and creative work of Roger Link." />
  <meta property="og:url" content="https://rogerlink.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://rogerlink.com/images/me.jpg" />

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Roger Link - Maker and Software Engineer" />
  <meta name="twitter:description" content="Explore the portfolio and creative work of Roger Link." />
  <meta name="twitter:image" content="https://rogerlink.com/images/me.jpg" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Roger Link",
    "url": "https://rogerlink.com/",
    "sameAs": [
      "https://www.linkedin.com/in/rogerlink/",
      "https://cancelledfutures.bandcamp.com/album/asdf"
    ],
    "jobTitle": "Maker and Software Engineer"
  }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600&display=swap" rel="stylesheet"/>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #030203;
      font-family: 'Space Grotesk', sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 0;
    }

    /* ---------- shared: nav / portfolio / lightbox (identical in both variants) ---------- */
    .nav {
      position: fixed;
      top: 20px;
      right: 30px;
      z-index: 4;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #e8d6ff;
      text-decoration: none;
      padding: 6px 12px;
      background: rgba(0,0,0,.3);
      border-radius: 4px;
      transition: background .3s ease;
      /* explicit — Space Grotesk isn't loaded at 400, so an unset weight here was silently
         getting matched to the nearest loaded weight (~500), while the name mark next to it
         requested 600 or 300. Same family, different actual weights rendered. */
      font-weight: 500;
    }

    .nav a:hover {
      background: rgba(255,255,255,.1);
    }

    @media (max-width: 600px) {
      .nav {
        flex-direction: column;
        align-items: flex-end;
        right: 15px;
        top: 15px;
        gap: 4px;
      }

      .nav a {
        font-size: 0.9em;
        padding: 4px 8px;
      }
    }

    .portfolio {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,.9);
      overflow: auto;
      z-index: 20;
      padding: 60px 5vw 40px;
      box-sizing: border-box;
      max-width: 100vw;
      overflow-x: hidden;
    }

    .portfolio .close {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 2em;
      color: #e8d6ff;
      cursor: pointer;
      z-index: 21;
    }

    .portfolio h3 {
      color: #e8d6ff;
      text-align: center;
      margin: 0;
    }

    .portfolio-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .portfolio-filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .portfolio-filter {
      color: #e8d6ff;
      font: inherit;
      font-size: 0.95rem;
      padding: 6px 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(232,214,255,.25);
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }

    .portfolio-filter:hover,
    .portfolio-filter[aria-pressed="true"] {
      color: #fff;
      background: rgba(232,214,255,.16);
      border-color: rgba(232,214,255,.7);
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(clamp(120px, 25%, 180px), 1fr));
      gap: 20px;
    }

    .image-grid img {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .image-grid img:hover {
      transform: scale(1.05);
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,.9);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 2em;
      color: #e8d6ff;
      cursor: pointer;
      z-index: 1000;
    }

    @media (max-width: 600px) {
      .image-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
      }

      .portfolio {
        padding: 40px 4vw 30px;
      }

      .portfolio h3 {
        font-size: 1.2em;
      }

      .portfolio-header {
        gap: 12px;
        margin-bottom: 20px;
      }

      .portfolio-filter {
        font-size: 0.85rem;
        padding: 5px 9px;
      }
    }

    /* ---------- shared: name mark, top-left corner, mirroring the nav in the top-right —
       a signature/masthead rather than a headline competing with the artwork ---------- */
    .name,
    .site-name {
      position: fixed;
      top: 20px;
      left: 30px;
      margin: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* ---------- variant: yesterday (matches the committed look, weight aligned to nav) ---------- */
    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: #fff;
      text-shadow: 0 0 1px rgba(255,255,255,.2), 0 1px 2px rgba(0,0,0,.25);
    }

    /* ---------- variant: today (same weight/case as nav — was uppercase + thin + wide
       letter-spacing, which read as a different typeface sitting right next to the nav) ---------- */
    .site-name {
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      letter-spacing: 0.02em;
      font-size: 1.1rem;
      text-shadow: 0 0 24px rgba(0, 0, 0, 0.55), 0 0 4px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <!-- variant: yesterday -->
  <div class="name" id="yesterdayName" style="display:none;">Roger Link</div>

  <!-- variant: today -->
  <h1 class="site-name" id="todayName" style="display:none;">Roger Link</h1>

  <script>
    document.getElementById(window.__variant === "today" ? "todayName" : "yesterdayName").style.display = "";
  </script>

  <!-- ---------- shared: nav / portfolio / lightbox ---------- -->
  <div class="nav">
    <a href="#" id="showPortfolio">Portfolio</a>
    <a href="/bio.html">Bio</a>
    <a href="https://cancelledfutures.bandcamp.com/album/asdf" target="_blank">Cancelled Futures</a>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" id="lightboxClose">&times;</div>
    <img src="" alt="">
  </div>
  <div class="portfolio" id="portfolio">
    <div class="close" id="closePortfolio">&times;</div>
    <div class="portfolio-header">
      <h3>Portfolio</h3>
      <div class="portfolio-filters" id="portfolioFilters" aria-label="Portfolio filters"></div>
    </div>
    <div class="image-grid" id="imageGrid"></div>
  </div>

  <script>
    const PORTFOLIO_PARAM = 'filter';

    function getFilterFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get(PORTFOLIO_PARAM);
    }

    function setFilterInURL(type) {
      const url = new URL(window.location.href);
      if (type === 'all') {
        url.searchParams.delete(PORTFOLIO_PARAM);
      } else {
        url.searchParams.set(PORTFOLIO_PARAM, type);
      }
      history.replaceState(null, '', url.toString());
    }

    document.getElementById('showPortfolio').onclick = e => {
      e.preventDefault();
      activeType = 'current';
      setFilterInURL(activeType);
      renderFilters();
      renderPortfolio();
      document.getElementById('portfolio').style.display = 'block';
    };
    document.getElementById('closePortfolio').onclick = () => {
      document.getElementById('portfolio').style.display = 'none';
      setFilterInURL('all');
    };
    document.getElementById('lightbox').onclick = () => {
      document.getElementById('lightbox').style.display = 'none';
    };
    document.getElementById('lightboxClose').onclick = () => {
      document.getElementById('lightbox').style.display = 'none';
    };

    const typeLabels = {
      all: 'All',
      current: 'Current',
      drawing: 'Drawing',
      digital: 'Digital'
    };

    let portfolioItems = [];
    let activeType = 'all';
    const urlFilter = getFilterFromURL();
    if (urlFilter && Object.prototype.hasOwnProperty.call(typeLabels, urlFilter)) {
      activeType = urlFilter;
    }


    function renderFilters() {
      const filters = document.getElementById('portfolioFilters');
      filters.innerHTML = '';
      Object.entries(typeLabels).forEach(([type, label]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'portfolio-filter';
        button.textContent = label;
        button.setAttribute('aria-pressed', type === activeType ? 'true' : 'false');
        button.onclick = () => {
          activeType = type;
          setFilterInURL(type);
          renderFilters();
          renderPortfolio();
        };
        filters.appendChild(button);
      });
    }

    function renderPortfolio() {
      const grid = document.getElementById('imageGrid');
      grid.innerHTML = '';
      const visibleItems = activeType === 'all'
        ? portfolioItems
        : portfolioItems.filter(item => item.type === activeType);

      visibleItems.forEach(item => {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = `${typeLabels[item.type] || 'Portfolio'} work by Roger Link`;
        img.loading = 'lazy';
        img.onclick = () => {
          document.querySelector('#lightbox img').src = item.src;
          document.getElementById('lightbox').style.display = 'flex';
        };
        document.getElementById('imageGrid').appendChild(img);
      });
    }

    fetch('data/portfolio.json?v=portfolio-types-1', { cache: 'no-store' })
      .then(response => response.json())
      .then(items => {
        portfolioItems = items;
        renderFilters();
        renderPortfolio();
        if (urlFilter && Object.prototype.hasOwnProperty.call(typeLabels, urlFilter)) {
          document.getElementById('portfolio').style.display = 'block';
        }
      })
      .catch(() => {
        document.getElementById('imageGrid').innerHTML = '<p style="color:#e8d6ff;text-align:center;grid-column:1/-1;">Portfolio images could not be loaded.</p>';
      });
  </script>

  <!-- ---------- variant: yesterday — the wave sculpture as committed to master before
       today's warm palette / dimensionality work ---------- -->
  <script type="module">
  if (window.__variant === "yesterday") {
    const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { ShaderPass }] = await Promise.all([
      import("three"),
      import("three/addons/postprocessing/EffectComposer.js"),
      import("three/addons/postprocessing/RenderPass.js"),
      import("three/addons/postprocessing/UnrealBloomPass.js"),
      import("three/addons/postprocessing/ShaderPass.js"),
    ]);

    // ---------- shared GLSL: classic simplex 3D noise (Ashima Arts, MIT) ----------
    const NOISE_GLSL = `
vec3 mod289(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ *ns.x + ns.yyyy;
  vec4 y = y_ *ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy,h.x);
  vec3 p1 = vec3(a0.zw,h.y);
  vec3 p2 = vec3(a1.xy,h.z);
  vec3 p3 = vec3(a1.zw,h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

    // ---------- shared GLSL: layered fbm-ish noise used by both mesh and particles ----------
    const LOBES_GLSL = `
float lobes(vec3 p, float t, float uScale) {
  float n = snoise(p * uScale + t);
  n += 0.5 * snoise(p * uScale * 2.1 - t * 0.7 + 4.0);
  n += 0.25 * snoise(p * uScale * 4.3 + t * 1.3 + 9.0);
  return n / 1.75;
}
float surfaceDisp(vec3 p, float t, float uScale, float uAmp) {
  float n = lobes(p, t, uScale);
  float big = snoise(p * 0.8 + t * 0.15) * 0.5;
  return (n * 0.65 + big) * uAmp;
}
`;

    // ---------- shared GLSL: RGB<->HSV for continuous hue drift (public-domain utility) ----------
    const HSV_GLSL = `
vec3 rgb2hsv(vec3 c) {
  vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  float e = 1.0e-10;
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
}
vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}
`;

    // ---------- shared GLSL: traveling waves ----------
    const WAVE_GLSL = `
float stokes(float phase) {
  return cos(phase) + 0.16 * cos(2.0 * phase);
}
float waveDisp(vec3 p, float t) {
  float w1 = stokes(p.x * 4.2 - t * 0.85);
  float w2 = stokes(p.y * 4.2 - t * 0.75 + 1.3);
  float w3 = stokes((p.x + p.y) * 2.8 + t * 1.0 + 3.0);
  float w4 = stokes((p.x - p.y) * 2.6 - t * 0.9 + 5.0);
  return w1 * 0.32 + w2 * 0.32 + w3 * 0.21 + w4 * 0.19;
}
float totalDisp(vec3 p, float t, float uScale, float uAmp, float uWaveAmp) {
  float d = surfaceDisp(p, t, uScale, uAmp);
  d += waveDisp(p, t) * uWaveAmp;
  return d;
}
`;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030203);
    scene.fog = new THREE.FogExp2(0x030203, 0.05);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.3, 6.5);

    const boxGroup = new THREE.Group();
    scene.add(boxGroup);

    const key = new THREE.DirectionalLight(0xdcdce8, 1.6);
    key.position.set(2.5, 4, 4);
    scene.add(key);
    scene.add(new THREE.AmbientLight(0x241f2c, 0.85));

    const sickLight = new THREE.PointLight(0x8cff4a, 0.9, 9, 2);
    sickLight.position.set(-0.6, 0.4, 0.3);
    scene.add(sickLight);
    const sickLight2 = new THREE.PointLight(0xff2d8f, 0.7, 9, 2);
    sickLight2.position.set(0.7, -0.5, 0.4);
    scene.add(sickLight2);

    const sharedUniforms = {
      uTime: { value: 0 },
      uPulseFreq: { value: 0.28 },
      uAmp: { value: 0.4 },
      uScale: { value: 1.5 },
      uWaveAmp: { value: 0.72 },
      uHueShift: { value: 0 },
      uSatShift: { value: 0 },
      uValShift: { value: 0 },
      uWallHalf: { value: 2.15 },
    };

    const geo = new THREE.PlaneGeometry(1, 1, 2, 2);
    const mesh = new THREE.Mesh(
      geo,
      new THREE.ShaderMaterial({
        uniforms: {
          ...sharedUniforms,
          uColorA: { value: new THREE.Color(0x6d17a8) },
          uColorB: { value: new THREE.Color(0x9dff4f) },
          uColorC: { value: new THREE.Color(0xff2d9e) },
          uColorD: { value: new THREE.Color(0x3d0a52) },
          uFresnelColor: { value: new THREE.Color(0x8affe0) },
          uLightPos: { value: new THREE.Vector3(48, 5, 6) },
        },
        vertexShader: `
      ${NOISE_GLSL}
      ${LOBES_GLSL}
      ${WAVE_GLSL}
      uniform float uTime;
      uniform float uPulseFreq;
      uniform float uAmp;
      uniform float uScale;
      uniform float uWaveAmp;
      uniform float uWallHalf;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      varying float vNoise;
      varying float vNoise2;
      varying float vWave;
      varying float vFoam;

      void main() {
        vec2 uv = position.xy / uWallHalf;
        vec3 p = vec3(uv, 0.0);
        float t = uTime * uPulseFreq;
        float n = lobes(p, t, uScale);
        float disp = totalDisp(p, t, uScale, uAmp, uWaveAmp);
        vec3 displaced = vec3(position.xy, disp);

        float e = 0.01;
        float du = totalDisp(vec3(uv.x + e, uv.y, 0.0), t, uScale, uAmp, uWaveAmp);
        float dv = totalDisp(vec3(uv.x, uv.y + e, 0.0), t, uScale, uAmp, uWaveAmp);
        float eWorld = e * uWallHalf;
        vec3 bumpedNormal = normalize(vec3(-(du - disp) / eWorld, -(dv - disp) / eWorld, 1.0));

        vNoise = n;
        vNoise2 = snoise(p * uScale * 1.4 - t * 0.4 + 12.0);
        vWave = waveDisp(p, t);
        vFoam = snoise(p * 9.0 + t * 2.6) * 0.5 + 0.5;
        vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
        vWorldPos = worldPos.xyz;
        vNormal = normalize(mat3(modelMatrix) * bumpedNormal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
        fragmentShader: `
      ${HSV_GLSL}
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform vec3 uColorC;
      uniform vec3 uColorD;
      uniform vec3 uFresnelColor;
      uniform vec3 uLightPos;
      uniform float uHueShift;
      uniform float uSatShift;
      uniform float uValShift;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      varying float vNoise;
      varying float vNoise2;
      varying float vWave;
      varying float vFoam;
      void main() {
        float t1 = smoothstep(-0.3, 0.75, vNoise);
        float t2 = smoothstep(0.15, 0.85, vNoise2);
        vec3 base = mix(uColorD, uColorA, t1 * 0.85 + 0.15);
        base = mix(base, uColorC, pow(t2, 2.5) * 0.55);
        base = mix(base, uColorB, pow(max(vNoise2 - 0.4, 0.0), 2.0) * 1.3);

        float crest = smoothstep(0.1, 1.0, vWave);
        vec3 waveColor = mix(uColorC, uFresnelColor, 0.4);
        base = mix(base, waveColor, crest * 0.7);

      float vig = 1.0 - smoothstep(0.15, 1.0, dist * (1.0 + uVignette));
      color *= mix(0.6, 1.0, vig);
      gl_FragColor = vec4(color, 1.0);
    }
  `,
    });
    tripPass.renderToScreen = true;
    composer.addPass(tripPass);

    const clock = new THREE.Clock();
    const colorPhaseOffset = Math.random() * 1000;
    const baseAmp = sharedUniforms.uAmp.value;
    const basePulse = sharedUniforms.uPulseFreq.value;
    const baseWaveAmp = sharedUniforms.uWaveAmp.value;
    function pulseShape(phase) {
      const s = Math.sin(phase * Math.PI * 2.0);
      return Math.sign(s) * Math.pow(Math.abs(s), 0.4);
    }
    let lastFlinchStart = -Infinity;
    let nextFlinch = 4 + Math.random() * 5;
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      const escalation = Math.min(t / 45, 1);
      const heartbeatFreq = 0.55 + escalation * 1.5;

      if (t >= nextFlinch) {
        lastFlinchStart = t;
        nextFlinch = t + 5 + Math.random() * 9;
      }
      const flinch = Math.exp(-Math.max(0, t - lastFlinchStart) * 7.0) * (t >= lastFlinchStart ? 1 : 0);

      sharedUniforms.uTime.value = t;
      sharedUniforms.uPulseFreq.value = basePulse + escalation * 0.35;
      const beat = pulseShape(t * heartbeatFreq);
      sharedUniforms.uAmp.value = baseAmp * (1.0 + 0.22 * beat + flinch * 0.5);
      sharedUniforms.uWaveAmp.value = baseWaveAmp * (1.0 + 0.3 * Math.max(beat, 0.0) + flinch * 0.5);

      const throb = 0.5 + 0.5 * beat;
      sickLight.intensity = 0.6 + throb * 0.7 + escalation * 0.3 + flinch * 1.2;
      sickLight2.intensity = 0.4 + (1 - throb) * 0.6 + escalation * 0.25 + flinch * 0.9;

      const shudder = Math.max(beat - 0.7, 0.0) * 0.06 + flinch * 0.09;
      camera.position.x = Math.sin(t * 0.045) * 0.4 + Math.sin(t * 47.0) * shudder;
      camera.position.y = 0.3 + Math.cos(t * 0.037) * 0.22 + Math.cos(t * 53.0) * shudder;
      camera.position.z = 6.5 + Math.sin(t * 0.021) * 0.15;
      camera.lookAt(0, 0.3, 0.2);

      tripPass.uniforms.uTime.value = t;
      tripPass.uniforms.uAberration.value = 0.0022 + escalation * 0.0022 + throb * 0.0008 + flinch * 0.006;

      const tc = t + colorPhaseOffset;
      sharedUniforms.uHueShift.value =
        0.07 * Math.sin(tc * 0.055) + 0.04 * Math.sin(tc * 0.0151 + 2.0) + flinch * 0.12;
      sharedUniforms.uSatShift.value = 0.15 * Math.sin(tc * 0.023 + 1.0) + 0.08 * Math.sin(tc * 0.061 + 4.0);
      sharedUniforms.uValShift.value = 0.12 * Math.sin(tc * 0.037 + 2.5) + flinch * 0.2;

      composer.render();
    });
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.setSize(window.innerWidth, window.innerHeight);
      fitWallToView();
    });
  }
  </script>
