name: Access List Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "24 15 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run scrapers
        run: node access-list/scripts/scrape-all.mjs

      - name: Commit scraper updates
        run: |
          if git diff --quiet -- access-list/data/candidates.json access-list/data/opportunities.json; then
            echo "No scraper changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add access-list/data/candidates.json access-list/data/opportunities.json
          git commit -m "Update access-list scraped listings"
          git push
